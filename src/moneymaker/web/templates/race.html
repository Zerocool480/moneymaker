{% extends "base.html" %}
{% block content %}
<section class="event-head">
  <div>
    <h1 class="screen-title">RACE OUTLOOK</h1>
    <div class="meta mono">the projection desk — rival picks sampled from the fitted choice model</div>
  </div>
  <form id="race-form" hx-post="/race/run" hx-target="#race-result"
        hx-indicator="#race-btn" hx-disabled-elt="find button" hx-sync="this:drop"
        class="inline-form">
    <div class="seg-tabs">
      {% for b in boards %}
      <label class="seg-tab {{ 'active' if b == board }}">
        <input type="radio" name="board" value="{{ b }}" {{ "checked" if b == board }} class="vis-hidden">
        {{ b|replace("segment","SEG ")|upper }}</label>
      {% endfor %}
    </div>
    <button class="btn primary" type="submit" id="race-btn"
            data-busy="DEALING THE SUNDAYS">RE-RUN</button>
    <details class="adv">
      <summary>advanced</summary>
      <label class="field">trials
        <select name="n">
          <option value="20000">20k</option>
          <option value="60000">60k</option>
          <option value="150000">150k</option>
          <option value="300000">300k</option>
        </select></label>
      <label class="field check"><input type="checkbox" name="sensitivity" value="true"> sensitivity band</label>
      <label class="field check"><input type="checkbox" name="point" value="true"> point picks</label>
    </details>
  </form>
</section>
<div id="race-result"
     hx-post="/race/run" hx-trigger="load" hx-include="#race-form"
     hx-indicator="#race-btn">
  <section class="card ghost">
    <div class="ghost-bones"><span></span><span></span><span></span></div>
    <p class="ghost-cap">dealing 20,000 Sundays — the projection lands here</p>
  </section>
</div>
{% endblock %}
